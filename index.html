            const flashClass = lastFlashedStockId === stock.id ? (stock.trend >= (stock.lastTrend || stock.trend) ? 'flash-up' : 'flash-down') : '';
            
            container.innerHTML = `<div class="absolute top-0 right-0 w-64 h-64 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div><div class="p-5 md:p-8 flex-grow flex flex-col h-full relative z-10 overflow-y-auto"><div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-6 border-b border-gray-800 pb-4 gap-4"><div><h2 class="text-2xl md:text-3xl font-bold flex items-center gap-3 text-white">${stock.name}<span class="text-xs font-normal px-3 py-1 bg-gray-800 rounded-full text-gray-300 border border-gray-700 whitespace-nowrap">位階: <span class="text-yellow-400 font-bold">${stock.baseLevel}</span></span></h2><div class="mt-3 flex items-center gap-2"><div class="flex items-center gap-1 bg-gradient-to-r from-blue-900 to-indigo-900 px-3 py-1.5 rounded-lg border border-indigo-500/50 shrink-0"><i class="ph-fill ph-robot text-indigo-300"></i><span class="text-xs font-bold text-indigo-200">AI評分:</span><span class="text-sm font-extrabold text-white">${stock.aiScore}%</span></div><div class="text-[13px] text-gray-400 border-l border-gray-700 pl-3 leading-tight hidden md:block">${stock.aiReason}</div></div></div><div class="text-right w-full md:w-auto"><div class="text-4xl font-mono font-bold ${trendColor} transition-colors text-right ${flashClass}">${formatPrice(stock.price)}</div><div class="text-sm font-mono mt-1 ${trendColor} text-right">${formatTrend(stock.trend)}</div></div></div><div class="grid grid-cols-1 md:grid-cols-3 gap-3 md:gap-4 mb-6 shrink-0"><div class="bg-blue-950/40 border border-blue-900/60 rounded-xl p-4 flex flex-col"><div class="text-blue-400 text-xs font-bold mb-1.5 flex items-center gap-1.5"><i class="ph-bold ph-wallet"></i> 建議進場區間</div><div class="text-gray-100 font-bold text-sm">${stock.buyAdvice}</div></div><div class="bg-red-950/40 border border-red-900/60 rounded-xl p-4 flex flex-col"><div class="text-red-400 text-xs font-bold mb-1.5 flex items-center gap-1.5"><i class="ph-bold ph-target"></i> 目標獲利價</div><div class="text-red-300 font-bold text-sm">${stock.targetAdvice}</div></div><div class="bg-green-950/40 border border-green-900/60 rounded-xl p-4 flex flex-col"><div class="text-green-400 text-xs font-bold mb-1.5 flex items-center gap-1.5"><i class="ph-bold ph-warning-circle"></i> 嚴格防守停損</div><div class="text-green-300 font-bold text-sm">${stock.stopLoss}</div></div></div><div class="space-y-4"><div class="bg-gray-800/40 p-5 rounded-xl border border-gray-700/50"><h3 class="text-base font-bold text-blue-400 flex items-center gap-2 mb-4"><i class="ph-fill ph-database text-lg"></i> 業績與未來性</h3><div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4"><div class="bg-gray-900/80 p-3 rounded-lg border border-gray-700 flex flex-col justify-center items-center text-center shadow-inner"><div class="text-[11px] text-gray-400 mb-1">本益比(P/E)</div><div class="text-sm font-bold text-gray-200">${stock.metrics.pe}</div></div><div class="bg-gray-900/80 p-3 rounded-lg border border-gray-700 flex flex-col justify-center items-center text-center shadow-inner"><div class="text-[11px] text-gray-400 mb-1">財報 EPS</div><div class="text-sm font-bold text-gray-200">${stock.metrics.eps}</div></div><div class="bg-gray-900/80 p-3 rounded-lg border border-gray-700 flex flex-col justify-center items-center text-center shadow-inner"><div class="text-[11px] text-gray-400 mb-1">營收(YoY)</div><div class="text-sm font-bold text-red-400">${stock.metrics.yoy}</div></div><div class="bg-gray-900/80 p-3 rounded-lg border border-gray-700 flex flex-col justify-center items-center text-center shadow-inner"><div class="text-[11px] text-gray-400 mb-1">預估殖利率</div><div class="text-sm font-bold text-yellow-500">${stock.metrics.yield}</div></div></div><p class="text-gray-300 leading-relaxed text-sm pt-3 border-t border-gray-700/50">${stock.fundamentals}</p></div><div class="grid grid-cols-1 md:grid-cols-2 gap-4"><div class="bg-gray-800/40 p-5 rounded-xl border border-gray-700/50 h-full"><h3 class="text-base font-bold text-purple-400 flex items-center gap-2 mb-3"><i class="ph-fill ph-chart-line text-lg"></i> 技術線型</h3><p class="text-gray-300 leading-relaxed text-sm">${stock.technical}</p></div><div class="bg-gray-800/40 p-5 rounded-xl border border-gray-700/50 h-full"><h3 class="text-base font-bold text-amber-400 flex items-center gap-2 mb-3"><i class="ph-fill ph-shield-check text-lg"></i> 籌碼面</h3><p class="text-gray-300 leading-relaxed text-sm">${stock.chips}</p></div></div></div></div>`;
        }

        renderTabs(); renderStockList(); renderStockDetails();

        const today = new Date();
        document.getElementById('time-display').textContent = `回測基準：2026/02/28 至 ${today.getFullYear()}/${String(today.getMonth()+1).padStart(2,'0')}/${String(today.getDate()).padStart(2,'0')}`;

        // 🚀 Yahoo V8 光速併發引擎 (0.5秒抓取，免金鑰，GitHub完美相容)
        async function fetchRealData() {
            const btn = document.getElementById('update-btn'), icon = document.getElementById('update-icon');
            const statusDot = document.getElementById('status-dot'), statusText = document.getElementById('status-text');

            btn.disabled = true; 
            btn.className = 'bg-gray-700 text-gray-300 text-sm font-bold py-2.5 px-6 rounded-lg transition-colors border border-gray-600 flex items-center justify-center gap-2 w-full shadow-inner cursor-not-allowed';
            icon.className = 'ph-bold ph-spinner animate-spin';
            statusDot.className = 'w-2.5 h-2.5 bg-yellow-500 rounded-full inline-block animate-pulse shadow-[0_0_8px_currentColor] shrink-0';
            statusText.className = 'text-yellow-400 font-bold';
            statusText.textContent = 'Yahoo V8 併發引擎光速抓取中...';

            const symbolMap = { '2330':'2330.TW', '2317':'2317.TW', '3324':'3324.TWO', '2303':'2303.TW', '3231':'3231.TW', '2353':'2353.TW', '1504':'1504.TW', '1513':'1513.TW', '3481':'3481.TW', '2615':'2615.TW', '0050':'0050.TW', '00878':'00878.TW', '00929':'00929.TW' };

            try {
                // 使用 Promise.all 同時發射 13 個請求，瀏覽器會自動平行處理，耗時不到 1 秒
                const fetchPromises = stocks.map(async (stock) => {
                    const yahooId = symbolMap[stock.id];
                    try {
                        const response = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${yahooId}?interval=1d`);
                        if (response.ok) {
                            const data = await response.json();
                            if (data.chart && data.chart.result && data.chart.result.length > 0) {
                                const meta = data.chart.result[0].meta;
                                const currentPrice = meta.regularMarketPrice;
                                const prevClose = meta.chartPreviousClose || meta.previousClose;
                                if (currentPrice && prevClose) {
                                    const changePercent = ((currentPrice - prevClose) / prevClose) * 100;
                                    stock.lastTrend = stock.trend;
                                    stock.price = currentPrice;
                                    stock.trend = changePercent;
                                    return stock.id; // 成功標記
                                }
                            }
                        }
                    } catch (e) {
                        console.warn(`[${stock.id}] 抓取失敗:`, e);
                    }
                    return null;
                });

                // 等待所有請求完成
                const results = await Promise.all(fetchPromises);
                const successCount = results.filter(id => id !== null).length;

                if (successCount > 0) {
                    lastFlashedStockId = results.find(id => id !== null); 
                    renderStockList();
                    if(selectedStockId) renderStockDetails();

                    btn.className = 'bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold py-2.5 px-6 rounded-lg transition-colors border border-emerald-500 flex items-center justify-center gap-2 w-full shadow-lg';
                    icon.className = 'ph-bold ph-check';
                    btn.innerHTML = `<i class="ph-bold ph-check"></i> 真實報價已成功更新`;
                    statusDot.className = 'w-2.5 h-2.5 bg-emerald-500 rounded-full inline-block shadow-[0_0_8px_currentColor] shrink-0';
                    statusText.className = 'text-emerald-400 font-bold';
                    statusText.textContent = `✅ 光速同步成功！1秒內已更新 ${successCount} 檔行情。`;
                } else {
                    throw new Error('全數抓取失敗');
                }

            } catch (error) {
                console.error("更新失敗:", error);
                btn.className = 'bg-red-600 hover:bg-red-500 text-white text-sm font-bold py-2.5 px-6 rounded-lg transition-colors border border-red-500 flex items-center justify-center gap-2 w-full shadow-lg';
                icon.className = 'ph-bold ph-warning';
                btn.innerHTML = `<i class="ph-bold ph-warning"></i> 網路連線異常`;
                statusDot.className = 'w-2.5 h-2.5 bg-red-500 rounded-full inline-block shadow-[0_0_8px_currentColor] shrink-0';
                statusText.className = 'text-red-400 font-bold';
                statusText.textContent = `❌ 無法連線至 Yahoo，目前顯示系統快照數據。`;
            }

            // 冷卻機制
            setTimeout(() => {
                lastFlashedStockId = null;
                btn.disabled = false;
                btn.className = 'bg-blue-600 hover:bg-blue-500 text-white text-sm font-bold py-2.5 px-6 rounded-lg transition-colors border border-blue-500 flex items-center justify-center gap-2 w-full shadow-lg';
                btn.innerHTML = `<i class="ph-bold ph-arrows-clockwise" id="update-icon"></i> 再次獲取最新報價`;
            }, 3000);
        }
    </script>
</body>
